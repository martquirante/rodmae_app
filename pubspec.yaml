name: rodmae_app
description: "RodMae App - private wedding companion app for Rodel and Eurine."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_database: ^11.3.0
  firebase_messaging: ^15.2.1
  flutter_local_notifications: ^18.0.1
  flutter_map: ^7.0.2
  google_fonts: ^6.2.1
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.1
  image_picker: ^1.1.2
  latlong2: ^0.9.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  lottie: ^3.1.2
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.5.5
  geolocator: ^14.0.2
  geocoding: ^3.0.0
  http: ^1.6.0
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.0
  any_link_preview: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.4.0
  record: ^7.1.0
  audioplayers: ^6.7.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  package_info_plus: ^10.1.0
  ntp: ^2.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#0A192F"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/animations/
    - assets/images/
    # Walking sprite frames (4-frame cycle per person)
    - assets/maps_res/walking/rodel/
    - assets/maps_res/walking/eurine/
    # Vehicle rear-view images
    - assets/maps_res/markers/biking/
    - assets/maps_res/markers/motorcycle/
    - assets/maps_res/markers/driving/
    - assets/maps_res/markers/transit/
    # Destination / place markers
    - assets/maps_res/markers/home/
    - assets/maps_res/markers/office/
