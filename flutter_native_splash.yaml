# flutter_native_splash configuration for RodMae App
#
# After editing this file, run:
#   dart run flutter_native_splash:create
# To revert back to the default Flutter splash:
#   dart run flutter_native_splash:remove

flutter_native_splash:

  # ── BACKGROUND ───────────────────────────────────────────────────────────────
  # Match the app's primary dark background (RodMaeColors.background = 0xFF04091A)
  color: "#04091A"

  # ── LOGO IMAGE ───────────────────────────────────────────────────────────────
  # Centered logo shown on the native splash. Keep it commented out if you want a solid color splash.
  # image: assets/images/app_logo.png

  # ── ANDROID 12+ (Splash Screen API) ──────────────────────────────────────────
  # Without this block the plugin falls back to the legacy splash on API 31+,
  # which ignores the splash entirely and shows a brief white flash.
  android_12:
    # Background color for the new Splash Screen API window.
    color: "#04091A"

    # The icon shown in the center (must be < 1152x1152 px; the OS clips it to
    # a circle on some launchers, so a transparent-BG PNG works best).
    # image: assets/images/app_logo.png

    # Branding image shown at the bottom of the screen (optional).
    # Leave commented out if you don't have one.
    # branding: assets/images/branding.png

    # Icon background color — shown behind the logo if the PNG has transparency.
    # icon_background_color: "#04091A"

  # ── ANDROID LEGACY (API ≤ 30) ────────────────────────────────────────────────
  android: true
  ios: true
  web: false

  # ── OPTIONAL: fill the full screen with the color (no white edges) ───────────
  fullscreen: false

  # ── GRAVITY / POSITION ───────────────────────────────────────────────────────
  # center_image=true keeps the logo perfectly centered (default and recommended)
  android_gravity: center
  ios_content_mode: center
